name: Size

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lockb'
      - '.github/workflows/bundle-size-analysis.yml'

permissions:
  pull-requests: write

jobs:
  size:
    name: Report bundle and install size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.base_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies (base)
        run: bun install

      - name: Build (base)
        run: bun run build

      - name: Get base bundle size
        id: base-bundle-size
        run: |
          echo "base=$(du -sk dist | cut -f1)" >> $GITHUB_ENV

      - name: Get base install size
        id: base-install-size
        run: |
          echo "base=$(bunx howfat -r simple . | grep 'Size:' | awk '{print $2}' | sed 's/K//')" >> $GITHUB_ENV

      - name: Checkout PR branch
        uses: actions/checkout@v3

      - name: Install dependencies (PR)
        run: bun install

      - name: Build (PR)
        run: bun run build

      - name: Get PR bundle size
        id: pr-bundle-size
        run: |
          echo "pr=$(du -sk dist | cut -f1)" >> $GITHUB_ENV

      - name: Get PR install size and full howfat output
        id: pr-install-size
        run: |
          echo "pr=$(bunx howfat -r simple . | grep 'Size:' | awk '{print $2}' | sed 's/K//')" >> $GITHUB_ENV
          echo "full_output<<EOF" >> $GITHUB_ENV
          bunx howfat -r table . >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Calculate bundle size difference
        id: bundle-size-diff
        run: |
          base_size=${{ env.base-bundle-size }}
          pr_size=${{ env.pr-bundle-size }}
          diff=$((pr_size - base_size))
          echo "diff=$diff" >> $GITHUB_ENV

      - name: Calculate install size difference
        id: install-size-diff
        run: |
          base_size=${{ env.base-install-size }}
          pr_size=${{ env.pr-install-size }}
          diff=$(echo "$pr_size - $base_size" | bc)
          echo "diff=$diff" >> $GITHUB_ENV

      - name: Find Existing Comment
        id: find-comment
        run: |
          comment_id=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.user.login == "github-actions[bot]") | .id' | head -n 1)
          echo "COMMENT_ID=$comment_id" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

      - name: Post or Update PR Comment
        if: |
          env.bundle-size-diff | tonumber >= 10
          or env.bundle-size-diff | tonumber <= -10
          or env.install-size-diff | tonumber >= 10
          or env.install-size-diff | tonumber <= -10
        run: |
          COMMENT_BODY="## Size Report
          ### Bundle Size
          - Base branch size: ${{ env.base-bundle-size }} KB
          - PR branch size: ${{ env.pr-bundle-size }} KB
          - Difference: ${{ env.bundle-size-diff }} KB

          ### Install Size
          - Base branch size: ${{ env.base-install-size }} KB
          - PR branch size: ${{ env.pr-install-size }} KB
          - Difference: ${{ env.install-size-diff }} KB

          ### Full Howfat Output (PR Branch)
          \`\`\`
          ${{ env.pr-install-size.full_output }}

          (aside)
          \`\`\`
          "

          if [[ -z "$COMMENT_ID" ]]; then
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              -f body="$COMMENT_BODY"
          else
            gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID \
              --method PATCH \
              -f body="$COMMENT_BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
